<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>404 — Page Not Found | ApexBoost</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080b10;
      --primary: #14b8a6;
      --secondary: #f97316;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --panel: rgba(15,23,42,0.85);
      --border: rgba(20,184,166,0.18);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 20px;
      font-family: 'Outfit', sans-serif;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(20,184,166,0.12) 0%, transparent 45%),
        radial-gradient(ellipse at 80% 80%, rgba(249,115,22,0.08) 0%, transparent 40%),
        radial-gradient(ellipse at 60% 10%, rgba(56,189,248,0.08) 0%, transparent 35%),
        linear-gradient(160deg, #080b10 0%, #0d1117 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    .card {
      max-width: 560px;
      width: 100%;
      text-align: center;
      padding: clamp(32px, 8vw, 56px) clamp(24px, 6vw, 48px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(24px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
      animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(28px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .code {
      font-size: clamp(4rem, 20vw, 7rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.06em;
      background: linear-gradient(135deg, var(--primary), var(--accent) 60%, var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { filter: brightness(1); }
      50%      { filter: brightness(1.2); }
    }

    h1 {
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      color: var(--text);
    }

    p {
      color: var(--muted);
      font-size: clamp(0.9rem, 2.5vw, 1.05rem);
      line-height: 1.65;
      margin-bottom: 32px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 28px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.97rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: filter 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
    .btn:active { transform: translateY(0); filter: brightness(0.95); }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent) 80%);
      color: #fff;
      box-shadow: 0 8px 28px rgba(20,184,166,0.32);
    }
    .btn-ghost {
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,0.1); }

    @media (max-width: 400px) {
      .actions { flex-direction: column; }
      .btn { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.<br>Head back to the homepage and keep boosting.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">← Back to Home</a>
      <a href="/dashboard" class="btn btn-ghost">Go to Dashboard</a>
    </div>
  </div>
</body>
</html>
